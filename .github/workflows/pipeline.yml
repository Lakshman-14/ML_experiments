name: Tourism purchase prediction pipeline

on:
  push:
    branches: [master]
    paths-ignore:
      - "model/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tourism-mlops-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m src.validate_data

  prepare-data:
    needs: validate-data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m src.prepare_data
      - uses: actions/upload-artifact@v4
        with:
          name: tourism-data-splits
          path: artifacts/splits/*.csv
          if-no-files-found: error

  train-and-save-model:
    needs: prepare-data
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: tourism-data-splits
          path: artifacts/splits
      - run: python -m src.train_model
      - run: python -m unittest discover -s tests -v
      - name: Commit updated model and evaluation results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/best_model.joblib model/metrics.json model/cv_results.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update tourism purchase model [skip model pipeline]"
            git push origin HEAD:master
          else
            echo "Model artifacts are unchanged."
          fi
